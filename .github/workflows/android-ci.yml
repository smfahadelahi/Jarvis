name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug (full compile verification)
        run: set -o pipefail && ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Surface compile errors as annotations
        if: failure()
        run: |
          {
            echo "## Compile errors"
            echo '```'
            grep -E "^e: |error: " build.log | head -40 || echo "(no compiler lines found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -50 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | sed -E 's|^e: file://[^ :]+(:[0-9]+:[0-9]+).*|\1|')
            path=$(printf '%s' "$line" | sed -E 's|^e: file://([^ :]+):[0-9]+:[0-9]+.*|\1|')
            msg=$(printf '%s' "$line" | sed -E 's|^e: file://[^ ]+ ||')
            if [ "$path" != "$line" ] && [ -n "$path" ]; then
              echo "::error file=${path#app/}${file%%:*}::${msg#*: }"
            else
              echo "::error::$line"
            fi
          done

      - name: Run unit tests
        run: set -o pipefail && ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Surface test failures as annotations
        if: failure()
        run: |
          {
            echo "## Test/compile errors"
            echo '```'
            grep -E "^e: |error: |FAILED" test.log | head -40 || echo "(no compiler lines found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " test.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done
